name: NightSignals CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          compact update || echo "compact update skipped (network unavailable)"
      - name: Install dependencies
        run: npm install
      - name: Compile Compact contract
        run: npm run compile
      - name: Upload managed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightsignals-managed
          path: contracts/managed/

  test:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install dependencies
        run: npm install
      - name: Download managed artifacts
        uses: actions/download-artifact@v4
        with:
          name: nightsignals-managed
          path: contracts/managed/
      - name: Run contract verification tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install frontend dependencies
        run: cd frontend && npm install
      - name: Build frontend
        run: cd frontend && npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: frontend
    if: github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://nightsignals.vercel.app
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install frontend dependencies
        run: cd frontend && npm install
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Deploy to Vercel
        id: vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'
          working-directory: ./frontend
