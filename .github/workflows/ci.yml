name: NightSignals CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          compact update

      - name: Install dependencies
        run: npm install

      - name: Compile Compact contract
        run: npm run compile

      - name: Upload managed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightsignals-managed
          path: contracts/managed/

  test:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Download managed artifacts
        uses: actions/download-artifact@v4
        with:
          name: nightsignals-managed
          path: contracts/managed/

      - name: Verify managed directory
        run: |
          echo "=== Managed directory contents ==="
          find contracts/managed -type f | sort
          echo ""
          echo "=== Checking for circuits ==="
          ls -la contracts/managed/nightsignals/zkir/ || echo "No zkir dir"
          echo "=== Checking for keys ==="
          ls -la contracts/managed/nightsignals/keys/ || echo "No keys dir"
          echo "=== Contract index ==="
          ls -la contracts/managed/nightsignals/contract/ || echo "No contract dir"

      - name: TypeScript build check
        run: npm run build
